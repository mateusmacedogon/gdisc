<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7971FE" />
      <stop offset="50%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark outer background base rounded rect -->
  <rect width="512" height="512" rx="128" fill="#0B0D12" />

  <!-- Main Glow Gradient Circle -->
  <circle cx="256" cy="256" r="192" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.35" stroke-dasharray="24 16" />

  <!-- Wave Arc Left -->
  <path d="M 176 196 A 84 84 0 0 0 176 316" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
  <path d="M 136 160 A 136 136 0 0 0 136 352" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.65" />

  <!-- Wave Arc Right -->
  <path d="M 336 196 A 84 84 0 0 1 336 316" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
  <path d="M 376 160 A 136 136 0 0 1 376 352" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.65" />

  <!-- Center Core Radio Signal Node -->
  <circle cx="256" cy="256" r="38" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="18" fill="#6C63FF" />
</svg>
